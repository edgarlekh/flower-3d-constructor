<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Конструктор букета — скоро</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .soon {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 48px 20px;
      gap: 24px;
    }
    h1 { font-size: clamp(28px, 6vw, 44px); margin: 0; }
    p { color: var(--muted); font-size: 18px; max-width: 32ch; margin: 0; }
    .steps { color: var(--muted); font-size: 14px; text-align: left; max-width: 34ch; }
    .steps li { margin: 6px 0; }
  </style>
</head>
<body>
  <main class="soon">
    <div class="badge" style="color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-size:13px;">Этап 1 в работе</div>
    <h1>Конструктор букета — скоро</h1>
    <p>Здесь будет 3D-сборка букета с каталогом-корзиной и живой сметой.</p>
    <ol class="steps">
      <li>Этап 1 — перенос конструктора из прототипа</li>
      <li>Этап 2 — перетаскивание цветов руками</li>
      <li>Этап 3 — пополнение каталога</li>
    </ol>
    <a class="btn btn-ghost" href="index.html">← На главную</a>
  </main>
</body>
</html>
