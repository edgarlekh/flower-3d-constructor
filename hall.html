<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зал — расстановка на столе</title>
<link rel="stylesheet" href="assets/css/hall.css">
</head>
<body>
<div id="stage"></div>

<div id="topbar">
  <a class="back" href="constructor.html">← В конструктор</a>
  <h1 class="serif">Зал</h1>
  <span class="guests">Гостей: <button id="g-minus">−</button><b id="guests">6</b><button id="g-plus">+</button></span>
  <span class="spacer"></span>
  <span id="readout">Стол ⌀<b>150</b> см · букетов: <b id="count">0</b></span>
</div>

<div id="tools">
  <button id="add" class="primary">+ Копия букета</button>
  <button id="remove">Убрать</button>
  <button id="clear">Очистить стол</button>
  <button id="reset">Вернуть вид</button>
</div>

<div id="warnings"></div>

<div id="empty" style="display:none">
  <div>
    <div class="serif">Букет не задан</div>
    <p>Соберите его в <a href="constructor.html">конструкторе</a> и нажмите «На стол».</p>
  </div>
</div>

<div id="hint" class="label">Потяните букет мышью — двигать по столу · пустое место — поворот · колесо — зум</div>

<div id="loader" class="scene-loader"><div class="spin"></div>Накрываем стол…</div>

<!-- движок three.js -->
<script src="assets/js/three.min.js"></script>
<!-- данные -->
<script src="assets/catalog/catalog.js"></script>
<script src="assets/catalog/models/vases.js"></script>
<script src="assets/catalog/models/rose.js"></script>
<!-- логика -->
<script src="assets/js/model-loader.js"></script>
<script src="assets/js/bouquet-engine.js"></script>
<script src="assets/js/bouquet-builder.js"></script>
<script src="assets/js/camera-controls.js"></script>
<script src="assets/js/flower-drag.js"></script>

<script>
(function(){
  // --- какой букет ставим: из конструктора (localStorage) или запасной ---
  const DEFAULT = { cart:{red:5, gros:3, euc:4, gyp:3}, vaseId:'tall', variantSeed:0, manual:{} };
  const HALL_KEY = 'flowerHall';        // сохранённая расстановка стола
  const PENDING_KEY = 'flowerPending';  // букет, присланный из конструктора «на стол»

  // spec.manual хранится как {key:[x,y,z]}; для сборщика нужен {key:Vector3}
  function manualVec(specManual){
    const m = {};
    if (specManual) for (const k in specManual){ const a = specManual[k]; m[k] = new THREE.Vector3(a[0],a[1],a[2]); }
    return m;
  }
  const readJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(_){ return null; } };

  const TABLE_R = 75, TABLE_H = 75;     // радиус 75 см (⌀150), высота 75 см
  const EDGE = TABLE_R - 16;            // букеты держим не у самого края
  let guests = 6;                        // число гостей = стульев и тарелок

  // --- сцена ---
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, .1, 4000);
  scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xD8D4CC, .62));
  const key = new THREE.DirectionalLight(0xFFF7EE, 1.05); key.position.set(120,220,140); scene.add(key);
  const rim = new THREE.DirectionalLight(0xDCE6F2, .32); rim.position.set(-140,90,-120); scene.add(rim);

  // пол
  const floor = new THREE.Mesh(new THREE.CircleGeometry(600, 48),
    new THREE.MeshStandardMaterial({color:0xEDEBE5, roughness:.95}));
  floor.rotation.x = -Math.PI/2; scene.add(floor);

  // мягкая тень под столом
  (function(){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d').createRadialGradient(64,64,6,64,64,62);
    g.addColorStop(0,'rgba(70,62,54,.32)'); g.addColorStop(1,'rgba(0,0,0,0)');
    const cx = c.getContext('2d'); cx.fillStyle = g; cx.fillRect(0,0,128,128);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(TABLE_R*2.6, TABLE_R*2.6),
      new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false}));
    m.rotation.x = -Math.PI/2; m.position.y = 0.4; scene.add(m);
  })();

  // стол: столешница + ножка + основание (несущая часть под скатертью)
  (function(){
    const wood = new THREE.MeshStandardMaterial({color:0xC9B79A, roughness:.7});
    const top = new THREE.Mesh(new THREE.CylinderGeometry(TABLE_R, TABLE_R, 4, 48), wood);
    top.position.y = TABLE_H - 2; scene.add(top);
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(9, 11, TABLE_H-4, 24), wood);
    stem.position.y = (TABLE_H-4)/2; scene.add(stem);
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(34, 36, 3, 32), wood);
    foot.position.y = 1.5; scene.add(foot);
  })();

  // скатерть: покрывает столешницу и спадает юбкой почти до пола
  (function(){
    const cloth = new THREE.MeshStandardMaterial({color:0xF3EEE6, roughness:.9, side:THREE.DoubleSide});
    const topDisk = new THREE.Mesh(new THREE.CircleGeometry(TABLE_R + 1.5, 48), cloth);
    topDisk.rotation.x = -Math.PI/2; topDisk.position.y = TABLE_H + 0.3; scene.add(topDisk);
    const skirt = new THREE.Mesh(new THREE.CylinderGeometry(TABLE_R + 1.5, TABLE_R + 3, TABLE_H - 4, 48, 1, true), cloth);
    skirt.position.y = (TABLE_H)/2 + 1; scene.add(skirt);
  })();

  // сервировка (стулья + тарелки + приборы) — своя группа, пересобирается при смене числа гостей
  const TABLE_TOP = TABLE_H + 0.6;
  const PLATE_R = TABLE_R - 16, PLATE_RAD = 13.5, CHAIR_R = TABLE_R + 24;
  const settingsGroup = new THREE.Group(); scene.add(settingsGroup);

  // мягкая тень-пятно под букетом (заземляет композицию на скатерти)
  const blobMat = (function(){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d').createRadialGradient(64,64,4,64,64,62);
    g.addColorStop(0,'rgba(70,62,54,.28)'); g.addColorStop(1,'rgba(0,0,0,0)');
    const cx = c.getContext('2d'); cx.fillStyle = g; cx.fillRect(0,0,128,128);
    return new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false});
  })();
  const blobGeo = new THREE.PlaneGeometry(1, 1);

  const plateMat = new THREE.MeshStandardMaterial({color:0xFAFAF7, roughness:.35, metalness:0});
  const metalMat = new THREE.MeshStandardMaterial({color:0xC7CBD0, roughness:.4, metalness:.5});
  const chairMat = new THREE.MeshStandardMaterial({color:0x8A6E52, roughness:.6});
  const plateGeo = new THREE.CylinderGeometry(PLATE_RAD, PLATE_RAD - 1.5, 1.4, 28);
  const cutGeo   = new THREE.BoxGeometry(1.4, 0.5, 17);
  const seatGeo  = new THREE.BoxGeometry(42, 4, 42);
  const backGeo  = new THREE.BoxGeometry(42, 42, 4);
  const legGeo   = new THREE.BoxGeometry(4, 45, 4);

  function chair(){
    const g = new THREE.Group();
    const seat = new THREE.Mesh(seatGeo, chairMat); seat.position.y = 45; g.add(seat);
    const back = new THREE.Mesh(backGeo, chairMat); back.position.set(0, 66, 20); g.add(back);
    for (const sx of [-18, 18]) for (const sz of [-18, 18]){
      const leg = new THREE.Mesh(legGeo, chairMat); leg.position.set(sx, 22.5, sz); g.add(leg);
    }
    return g;
  }
  function placeSetting(){
    const g = new THREE.Group();
    const plate = new THREE.Mesh(plateGeo, plateMat); plate.position.y = TABLE_TOP; g.add(plate);
    const fork = new THREE.Mesh(cutGeo, metalMat); fork.position.set(-PLATE_RAD - 5, TABLE_TOP, 0); g.add(fork);
    const knife = new THREE.Mesh(cutGeo, metalMat); knife.position.set(PLATE_RAD + 5, TABLE_TOP, 0); g.add(knife);
    return g;
  }

  // Пересобрать сервировку под N гостей.
  function buildTableSet(){
    while (settingsGroup.children.length) settingsGroup.remove(settingsGroup.children[0]);
    for (let i = 0; i < guests; i++){
      const a = i / guests * Math.PI * 2 - Math.PI/2;
      const cs = Math.cos(a), sn = Math.sin(a);
      // тарелка + приборы (развёрнуты «лицом» к центру)
      const set = placeSetting();
      set.position.set(cs * PLATE_R, 0, sn * PLATE_R);
      set.rotation.y = -a + Math.PI/2;
      settingsGroup.add(set);
      // стул (спинкой наружу)
      const ch = chair();
      ch.position.set(cs * CHAIR_R, 0, sn * CHAIR_R);
      ch.rotation.y = -a - Math.PI/2;
      settingsGroup.add(ch);
    }
  }

  // --- камера ---
  let FOCUS = new THREE.Vector3(0, TABLE_H + 10, 0), FIT = 300;
  const cam = window.createCameraControls(camera, renderer.domElement, {
    onInteract: () => document.getElementById('hint').classList.add('gone'),
    onReset: () => cam.frame(FOCUS, FIT, false),
  });
  function frameScene(){
    const R = Math.max(Math.hypot(TABLE_R, 55), 60);
    const fov = camera.fov*Math.PI/180;
    const vFit = R/Math.sin(fov/2);
    const hFit = R/Math.sin(2*Math.atan(Math.tan(fov/2)*Math.max(camera.aspect,0.4))/2);
    FIT = Math.max(vFit, hFit)*1.15;
    cam.frame(FOCUS, FIT, false);
  }

  // --- букеты на столе ---
  const bouquets = [];             // массив root-групп; у каждой userData.spec — свой букет
  let currentSpec = DEFAULT;       // какой букет копируем кнопкой «+ Копия»

  // Поставить букет по спецификации spec в точку (x,z). spec.manual — {key:[x,y,z]}.
  function placeBouquet(spec, x, z){
    const res = window.BouquetBuilder.build(spec.cart, spec.vaseId, spec.variantSeed, { manual: manualVec(spec.manual) });
    if (!res.flowerGroups.length && !res.vase){ return null; }
    const root = res.root;
    root.position.set(x, TABLE_H, z);
    root.userData.spec = spec;              // храним спецификацию для сохранения
    root.userData.footprint = Math.max(res.focus.radius, 8);   // радиус пятна букета (для проверок)
    // мягкая тень под букетом на скатерти
    const shadow = new THREE.Mesh(blobGeo, blobMat);
    shadow.rotation.x = -Math.PI/2; shadow.position.y = 0.35;
    const fp = root.userData.footprint; shadow.scale.set(fp*2.6, fp*2.6, 1);
    root.add(shadow);
    root.userData.grow = 0;                 // мягкое появление
    root.scale.setScalar(0.001);
    scene.add(root); bouquets.push(root);
    currentSpec = spec;
    updateReadout();
    return root;
  }

  // разложить очередную копию по кольцу на столе (свободное место)
  function nextSpot(){
    const n = bouquets.length;
    if (n === 0) return [0, 0];
    const ring = EDGE * 0.62;
    const a = (n-1) * (Math.PI*2 / 6) + 0.4;
    return [Math.cos(a)*ring, Math.sin(a)*ring];
  }

  function updateReadout(){
    document.getElementById('count').textContent = bouquets.length;
    document.getElementById('guests').textContent = guests;
    document.getElementById('empty').style.display = bouquets.length ? 'none' : 'grid';
  }

  // Сохранить всю расстановку стола (спеки + позиции + гостей), чтобы не терялась.
  function saveHall(){
    const items = bouquets.map(b => ({ spec: b.userData.spec, x: +b.position.x.toFixed(2), z: +b.position.z.toFixed(2) }));
    try { localStorage.setItem(HALL_KEY, JSON.stringify({ bouquets: items, seats: guests })); } catch(_){}
  }

  // Проверки «влезает/тесно»: считаем по реальным см и показываем предупреждения.
  function computeWarnings(){
    const w = [];
    // стулья вокруг стола
    const chairCirc = 2 * Math.PI * CHAIR_R;
    if (guests * 54 > chairCirc)
      w.push(['Стульям тесно', `${guests} гостей не рассадить вокруг стола ⌀${TABLE_R*2} см — нужен стол больше или меньше гостей.`]);
    // тарелки по краю
    const plateArc = 2 * Math.PI * PLATE_R / guests;
    if (plateArc < PLATE_RAD * 2 + 5)
      w.push(['Тарелки не помещаются', `На ${guests} персон не хватает места по краю стола.`]);
    // букеты заходят на тарелки
    const plates = [];
    for (let i = 0; i < guests; i++){ const a = i/guests*Math.PI*2 - Math.PI/2; plates.push([Math.cos(a)*PLATE_R, Math.sin(a)*PLATE_R]); }
    let hitPlate = false;
    bouquets.forEach(b => {
      const fp = b.userData.footprint || 12;
      plates.forEach(p => { if (Math.hypot(b.position.x - p[0], b.position.z - p[1]) < fp + PLATE_RAD) hitPlate = true; });
    });
    if (hitPlate) w.push(['Букет заходит на тарелки', 'Не влезает между приборами — сдвиньте ближе к центру или возьмите вазу уже.']);
    // букеты вплотную
    let tight = false;
    for (let i = 0; i < bouquets.length; i++) for (let j = i+1; j < bouquets.length; j++){
      const a = bouquets[i], b = bouquets[j];
      if (Math.hypot(a.position.x - b.position.x, a.position.z - b.position.z) < (a.userData.footprint||12) + (b.userData.footprint||12)) tight = true;
    }
    if (tight) w.push(['Букеты вплотную', 'Композиции перекрываются — расставьте свободнее.']);
    return w;
  }
  function renderWarnings(){
    const w = computeWarnings();
    document.getElementById('warnings').innerHTML =
      w.map(x => `<div class="warn"><strong>${x[0]}.</strong> ${x[1]}</div>`).join('');
  }

  // держим букет на столешнице: не даём уехать за край
  function moveBouquet(g, p){
    let x = p.x, z = p.z; const r = Math.hypot(x, z);
    if (r > EDGE){ x *= EDGE/r; z *= EDGE/r; }
    g.position.set(x, TABLE_H, z);
    renderWarnings();                       // живые проверки при перетаскивании
  }

  // --- перетаскивание букетов по столу (тот же движок, горизонтальная плоскость) ---
  const drag = window.createFlowerDrag(camera, renderer.domElement, {
    getPickables: () => bouquets,
    planeMode: 'horizontal',
    getAnchor: (g) => g.position,
    canGrab: () => true,
    setCameraPaused: (v) => cam.setPaused(v),
    moveTo: moveBouquet,
    onGrab: (g) => { g.userData.lift = true; document.getElementById('hint').classList.add('gone'); },
    onRelease: (g) => { g.userData.lift = false; saveHall(); },   // сохраняем новую позицию
  });

  function setGuests(n){
    guests = Math.max(2, Math.min(14, n));
    buildTableSet(); updateReadout(); renderWarnings(); saveHall();
  }

  // --- кнопки ---
  document.getElementById('add').addEventListener('click', () => {
    const [x,z] = nextSpot(); placeBouquet(currentSpec, x, z); saveHall(); renderWarnings();
  });
  document.getElementById('remove').addEventListener('click', () => {
    const g = bouquets.pop(); if (g) scene.remove(g); updateReadout(); saveHall(); renderWarnings();
  });
  document.getElementById('clear').addEventListener('click', () => {
    while (bouquets.length){ scene.remove(bouquets.pop()); }
    updateReadout(); saveHall(); renderWarnings();
  });
  document.getElementById('g-minus').addEventListener('click', () => setGuests(guests - 1));
  document.getElementById('g-plus').addEventListener('click', () => setGuests(guests + 1));
  document.getElementById('reset').addEventListener('click', () => cam.frame(FOCUS, FIT, false));

  function resize(){
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);

  function tick(){
    requestAnimationFrame(tick);
    bouquets.forEach(g => {
      if (g.userData.grow < 1){ g.userData.grow = Math.min(1, g.userData.grow + .06); g.scale.setScalar(1 - Math.pow(1 - g.userData.grow, 3)); }
      const targetLift = g.userData.lift ? 6 : 0;   // приподнимаем схваченный букет
      g.position.y += (TABLE_H + targetLift - g.position.y) * 0.25;
    });
    cam.updateInertia();
    renderer.render(scene, camera);
  }

  // --- старт: восстановить стол, добавить присланный из конструктора букет ---
  resize(); frameScene();

  // 1) восстанавливаем сохранённую расстановку (новая схема {bouquets,seats}; старая — массив)
  const savedHall = readJSON(HALL_KEY);
  let savedItems = null;
  if (Array.isArray(savedHall)) savedItems = savedHall;                 // старый формат
  else if (savedHall && Array.isArray(savedHall.bouquets)){ savedItems = savedHall.bouquets; if (savedHall.seats) guests = savedHall.seats; }
  if (savedItems) savedItems.forEach(it => { if (it && it.spec) placeBouquet(it.spec, it.x || 0, it.z || 0); });

  buildTableSet();                 // накрываем стол под число гостей

  // 2) если из конструктора прислали букет «на стол» — добавляем его и чистим «входящее»
  const pending = readJSON(PENDING_KEY);
  if (pending && pending.cart){
    const [x,z] = nextSpot(); placeBouquet(pending, x, z);
    localStorage.removeItem(PENDING_KEY);
  }

  // 3) совсем пусто (первый визит) — ставим запасной букет по центру
  if (!bouquets.length) placeBouquet(DEFAULT, 0, 0);

  updateReadout(); renderWarnings(); saveHall();
  tick();
  const loader = document.getElementById('loader');   // стол накрыт — убираем загрузку
  if (loader){ loader.classList.add('gone'); setTimeout(() => loader.remove(), 450); }

  // отладочный хук
  window.hallDebug = { scene, camera, cam, bouquets, settingsGroup, placeBouquet, moveBouquet, saveHall,
    buildTableSet, computeWarnings, setGuests: (n)=>setGuests(n), drag, TABLE_R, TABLE_H, EDGE, get guests(){return guests;} };
})();
</script>
</body>
</html>
